name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    # Pushes to main run the Apple silicon job on the self-hosted Mac named by the MAC_RUNNER
    # repository variable (a JSON list of runner labels), when it is set. Pull requests, manual
    # runs and the Intel job always use GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'macos-26' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MAC_RUNNER && fromJSON(vars.MAC_RUNNER) || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test agent handling, mouse profiles and mouse detection
        run: swift test
      - name: Check release selection
        run: |
          python3 scripts/test_release.py
          python3 scripts/test_sign_release.py
          python3 scripts/test_update_feed.py
      - name: Build and verify the app bundle
        env:
          SIGNING: adhoc
        run: ./build.sh
      - name: Check build failures, optional Herdr setup and mouse recognition
        env:
          MOUSEHERDR_TEST_BINARY: dist/MouseHerdr.app/Contents/MacOS/MouseHerdr
        run: python3 scripts/test_setup.py

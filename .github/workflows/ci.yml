name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test agent handling and mouse profiles
        run: swift test
      - name: Build and verify the app bundle
        env:
          SIGNING: adhoc
        run: ./build.sh
      - name: Check build failures and optional Herdr setup
        env:
          MOUSEHERDR_TEST_BINARY: dist/MouseHerdr.app/Contents/MacOS/MouseHerdr
        run: python3 scripts/test_setup.py
